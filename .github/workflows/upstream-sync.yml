name: Sync upstream

# Monthly (1st): merge logicog/RTLPlayground main into a sync branch and open a PR,
# so CI runs before anything lands on main. Conflicts are reported on an
# issue, never auto-resolved.

on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/logicog/RTLPlayground.git
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    # Self-hosted runner on a personal PC; steps use PowerShell, which
    # every Windows runner has (a bare `bash` may resolve to WSL or not exist).
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Optional PAT (SYNC_TOKEN): pushes made with GITHUB_TOKEN do not
          # trigger CI on the PR and cannot modify .github/workflows files.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote remove upstream 2>$null
          git remote add upstream $env:UPSTREAM
          git fetch upstream main
          if ($LASTEXITCODE -ne 0) { throw "fetch upstream failed" }
          git merge-base --is-ancestor upstream/main origin/main
          if ($LASTEXITCODE -eq 0) {
            "status=current" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            exit 0
          }
          git checkout -B $env:SYNC_BRANCH origin/main
          git merge --no-ff -m "Merge upstream logicog/RTLPlayground main" upstream/main
          if ($LASTEXITCODE -eq 0) {
            git push --force origin $env:SYNC_BRANCH
            if ($LASTEXITCODE -ne 0) { throw "push failed" }
            $status = "merged"
          } else {
            git diff --name-only --diff-filter=U | Out-File -Encoding utf8 "$env:RUNNER_TEMP/conflicts.txt"
            git merge --abort
            $status = "conflict"
          }
          $behind = git rev-list --count origin/main..upstream/main
          "status=$status" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "behind=$behind" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Open or update the PR
        if: steps.merge.outputs.status == 'merged'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN || github.token }}
          script: |
            const {owner, repo} = context.repo;
            const head = process.env.SYNC_BRANCH;
            const body = `Merges ${{ steps.merge.outputs.behind }} new upstream commit(s) from logicog/RTLPlayground main.\n\nCI must be green before merging. Review the diff for changes that touch fork features (LACP, STP, web UI).`;
            const open = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, state: 'open'});
            if (open.data.length) {
              await github.rest.pulls.update({owner, repo, pull_number: open.data[0].number, body});
            } else {
              await github.rest.pulls.create({owner, repo, head, base: 'main',
                title: 'Sync with upstream RTLPlayground', body});
            }

      - name: Report conflicts
        if: steps.merge.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync(process.env.RUNNER_TEMP + '/conflicts.txt', 'utf8').trim();
            const title = 'Upstream sync has merge conflicts';
            const body = `Merging logicog/RTLPlayground main into main conflicts in:\n\n\`\`\`\n${files}\n\`\`\`\n\nResolve by hand: \`git fetch upstream && git checkout -b upstream-sync origin/main && git merge upstream/main\`. This issue is updated by the next run.`;
            const {owner, repo} = context.repo;
            const issues = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'upstream-sync'});
            const found = issues.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({owner, repo, issue_number: found.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: ['upstream-sync']});
            }
