name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    # Self-hosted runner on a personal PC: never run code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    steps:
      # Keep LF line endings: the tree is bind-mounted into a Linux container.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6

      - name: Build dev image from the Dockerfile
        run: docker build -q -t rtlplayground-dev .

      # Windows checkouts can't create the machine/*.c symlinks; a clone inside the Linux container can.
      - name: Build and test inside the container
        run: >
          docker run --rm -v "${env:GITHUB_WORKSPACE}:/workspace" -w /workspace rtlplayground-dev
          sh -ec "git clone -q /workspace /src && cd /src && make -C test
          && make machine_check
          && make CI=1 MACHINE=KP_9000_6XHML_X2
          && make CI=1 MACHINE=KP_9000_9XHML_X_V3_1
          && make clean && make CI=1 MACHINE=KP_9000_6XHML_X2 HEALTH=1"
