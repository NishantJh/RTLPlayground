name: Build SWTG018AS-A V2.0 (Docker)

# Same build the dev loop uses (scripts/build.ps1): repo Dockerfile + make MACHINE=...
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    # Self-hosted runner on a personal PC: never run code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    env:
      MACHINE: SWTG018AS_A_V_2_0
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Makefile uses git describe

      - name: Build dev image from the Dockerfile
        run: docker build -q -t rtlplayground-dev .

      - name: Build firmware
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" rtlplayground-dev make MACHINE=$MACHINE
          ls -l output/$MACHINE/*.bin

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-${{ env.MACHINE }}
          path: output/${{ env.MACHINE }}/*.bin
          retention-days: 14
